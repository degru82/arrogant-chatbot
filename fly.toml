# Fly.io deployment configuration
app = "arrogant-chatbot"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

# Note: Telegram bots don't need HTTP service
# This config allows the app to run as a background worker
# The bot uses long polling instead of webhooks

[[services]]
  protocol = "tcp"
  internal_port = 8080

[[services.ports]]
  port = 80
  handlers = ["http"]

[[services.ports]]
  port = 443
  handlers = ["tls", "http"]

[env]
  # TELEGRAM_BOT_TOKEN should be set via: fly secrets set TELEGRAM_BOT_TOKEN=your_token_here

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
